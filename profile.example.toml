# Owner profile — copy to profile.toml and edit.
#
# This layer decides HOW MUCH and WHICH SYMBOLS. It can only ever be more
# conservative than the risk engine: every intent it produces still passes
# through RiskEngine.evaluate, so a mistake here cannot loosen a limit.
#
# A missing profile.toml is fine; the platform uses the defaults shown here.

name = "ian"

# Notional the bot may work with. Deliberately NOT your account size, so you
# can hand the bot a slice of a larger account.
capital_allocation = 25000

# conservative (0.5x) | moderate (1.0x) | aggressive (1.5x)
# Scales the per-position target. A preference dial, not leverage.
risk_appetite = "moderate"

# Per-position budget = capital_allocation / max_positions * risk multiplier.
# With the values above: 25000 / 5 * 1.0 = $5,000 per position.
max_positions = 5

# Symbols the bot may trade. Empty means "anything the risk allowlist permits".
symbols = ["SPY", "QQQ", "AAPL", "MSFT", "VTI", "TLT", "IEI", "GLD", "DBC", "BIL"]

# Never trade these, whatever any strategy says.
exclusions = []

# Benchmark for relative-strength criteria (Minervini's #8, O'Neil's L).
benchmark = "SPY"

# Hard ceiling on one position as a fraction of capital_allocation.
max_position_fraction = 0.35

# Orders below this notional are not worth the spread.
min_order_notional = 100

# Persona weights scale sizing within each persona. Unlisted personas get 1.0 —
# activation is an admin decision, so forgetting to list one here does not
# silently stop it trading.
[[personas]]
name = "paul_tudor_jones"
weight = 1.0

[[personas]]
name = "minervini"
weight = 0.8

[[personas]]
name = "oneil"
weight = 0.6
